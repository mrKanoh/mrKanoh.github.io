# Publica el sitio en GitHub Pages (https://mrkanoh.github.io).
# Fusionar o hacer push a main PUBLICA EN PRODUCCIÓN.
# Requiere que la fuente de Pages sea «GitHub Actions» (Settings → Pages → Source); al 2026-10-27
# es «Deploy from a branch» (Jekyll). Con esa fuente, GitHub no documenta qué pasa con este
# workflow: puede fallar o convivir con el build de Jekyll. Por eso Ariel cambia la fuente a
# «GitHub Actions» antes de fusionar.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela el que está en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sin `enablement`: activar Pages es decisión de Ariel.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
